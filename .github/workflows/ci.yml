name: CI build

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: 
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get install -y libblas-dev liblapack-dev cmake

    - name: Install macOS dependencies
      if: matrix.os == 'macos-latest'
      run: brew install libomp cmake

    - name: Set macOS config
      if: matrix.os == 'macos-latest'
      run: |
        echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

    - name: Configure CMake
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          RPATH='$ORIGIN/../lib'
        else
          RPATH='@loader_path/../lib'
        fi
        cmake -S . -B build \
          -DCMAKE_INSTALL_PREFIX=$(pwd)/install \
          -DCMAKE_INSTALL_LIBDIR=lib \
          -DCMAKE_INSTALL_RPATH="$RPATH" \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DNGT_BFLOAT_DISABLED=ON

    - run: cmake --build build

    - run: cmake --install build

    - run: install/bin/ngt -d 128 -o c create index data/sift-dataset-5k.tsv

  linux-core-openmp-disabled:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install build dependencies
      run: sudo apt-get install -y cmake

    - name: Configure core without OpenMP
      run: >-
        cmake -S . -B build-core-no-openmp
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -DNGT_OPENMP_DISABLED=ON
        -DNGT_QBG_DISABLED=ON
        -DNGT_BFLOAT_DISABLED=ON

    - name: Build core without OpenMP
      run: |
        set -euo pipefail
        if grep -q -- '-fopenmp' build-core-no-openmp/compile_commands.json; then
          echo "OpenMP compilation is unexpectedly enabled."
          exit 1
        fi
        cmake --build build-core-no-openmp --parallel 2

  windows-build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        openmp_disabled: ['OFF', 'ON']
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up MinGW
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-libgomp
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja

    - name: Configure CMake
      run: >-
        cmake -S . -B build-windows -G Ninja
        -DNGT_QBG_DISABLED=ON
        -DNGT_OPENMP_DISABLED=${{ matrix.openmp_disabled }}
        -DNGT_BFLOAT_DISABLED=ON
        -DNGT_MARCH_NATIVE_DISABLED=ON

    - name: Build
      run: cmake --build build-windows --parallel 2

    - name: Create and search SIFT index
      run: |
        set -e
        ./build-windows/bin/ngt/ngt.exe create -d 128 -o c build-windows/sift-index data/sift-dataset-5k.tsv
        # Unix readers require LF line endings in the property file.
        if LC_ALL=C grep -Uq $'\r' build-windows/sift-index/prf; then
          echo "The property file contains CRLF line endings."
          exit 1
        fi
        ./build-windows/bin/ngt/ngt.exe search -n 3 build-windows/sift-index data/sift-query-3.tsv > build-windows/search.txt
        test "$(grep -c 'Query No.' build-windows/search.txt)" -eq 3
        test "$(grep -Ec '^[123][[:space:]]+[0-9]+[[:space:]]+[0-9]+([.][0-9]+)?([eE][-+]?[0-9]+)?[[:space:]]*$' build-windows/search.txt)" -eq 9
